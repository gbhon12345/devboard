name: CI
on:
    push:
        branches: [advanced]

jobs:
    frontend:
        runs-on: ubuntu-latest
        steps:
            - name: code checkout
              uses: actions/checkout@v7

            - name: setup nodejs
              uses: actions/setup-node@v6
              with:
                  node-version: '20'
                  cache: npm
                  cache-dependency-path: frontend

            - name: install npm packages
              run: npm install
              working-directory: frontend

            - name: run linter
              run: npm run lint
              working-directory: frontend

            - name: run Test
              run: npm run test
              working-directory: frontend

            - name: docker login setup
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKERHUB_USERNAME}}
                PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD}}

            - name: docker build and push
              uses: docker/build-push-action@v7
              with:
                context: ./frontend
                push: true
                tags: ${{vars.DOCKERHUB_USERNAME}}/devboard-frontend0624:latest

    backend:
        runs-on: ubuntu-latest
        steps:
            - name: code checkout
              uses: actions/checkout@v7

            - name: setup go
              uses: actions/setup-go@v6
              with:
                  go-version: '1.23'
                  go-version-file: 'go.mod'
                  cache-dependency-path: go.sum

            - name: run go formatter
              run:  go fmt
              working-directory: backend

            - name: run go vet
              run:  go vet
              working-directory: backend

            - name: run go Test
              run: go test
              working-directory: backend

            - name: docker login setup
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKERHUB_USERNAME}}
                PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD}}

            - name: docker build and push
              uses: docker/build-push-action@v7
              with:
                context: ./backend
                push: true
                tags: ${{vars.DOCKERHUB_USERNAME}}/devboard-backend0624:latest

